<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GRAV Burger Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="logo">GRAV</div>

        <nav class="menu-bar">
            <button class="burger-button">BURGERS</button>

            <button class="menu-button">
                MENU
                <span class="menu-icon">☰</span>
            </button>
        </nav>
    </header>

    <main class="cards-container">

        <article class="box">
            <button class="add" aria-label="Add Classic Burger">+</button>

            <div class="image-area">
                <div class="checker-line"></div>

                <img
                    class="burger-photo"
                    src="image.png"
                    alt="Classic Burger"
                >
            </div>

            <div class="burger-info">
                <h2 class="name">Classic Burger</h2>
                <span class="price">$16</span>
            </div>
        </article>

        <article class="box">
            <button class="add" aria-label="Add Spicy Jalapeño Burger">+</button>

            <div class="image-area">
                <div class="checker-line"></div>

                <img
                    class="burger-photo"
                    src="image.png"
                    alt="Spicy Jalapeño Burger"
                >
            </div>

            <div class="burger-info">
                <h2 class="name">Spicy Jalapeño Burger</h2>
                <span class="price">$18</span>
            </div>
        </article>

        <article class="box">
            <button class="add" aria-label="Add Bacon Cheese Burger">+</button>

            <div class="image-area">
                <div class="checker-line"></div>

                <img
                    class="burger-photo"
                    src="image.png"
                    alt="Bacon Cheese Burger"
                >
            </div>

            <div class="burger-info">
                <h2 class="name">Bacon Cheese Burger</h2>
                <span class="price">$21</span>
            </div>
        </article>

    </main>
</body>
</html>
