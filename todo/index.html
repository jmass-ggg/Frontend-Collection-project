<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="my-task">
            <h1>My Task</h1>
            <div class="monday">Monday May 4</div>
        </div>
        <div class="take-input">
            <input id="task" placeholder="What do you need to do ?">
            <button id="submits" type="submit">+</button>
        </div>

        <div class="display">
            <div class="buttons">
                <button class="filter">All</button>
                <button class="filter">Completed</button>
                <button class="filter">Pending</button>
            </div>
            
            <div id="result" class="result">

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
