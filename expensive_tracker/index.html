<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Expense Tracker</h1>

        <section class="your-balance">
            <p>Your Balance</p>

            <div class="current-balance">
                $2,971.00
            </div>

            <div class="income-expense">

                <div class="income-table">
                    <span>Income</span>
                    <div class="income">$4,721.00</div>
                </div>

                <div class="expense-table">
                    <span>Expenses</span>
                    <div class="expense">$1,750.00</div>
                </div>

            </div>
        </section>

        <section class="main-contend">
            <div class="transcation-container">
                <h2>Transactions</h2>

            </div>
            <div class="form-container">
                <h2>Add Transaction</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label>Description</label>
                    <input id="description" class="description" placeholder="Enter description ...." required>


                    </div>
                    
                    <div class="form-group">
                        <label>Description</label>
                    <input id="amount" type ="number" class="description" placeholder="Enter amount ...." required>
                    <small>Use negative(-) for expenses </small>


                    </div>
                    <button type="submit">Add Transaction</button>

                </form>
            </div>

        </section>
    </div>

</body>
</html>
