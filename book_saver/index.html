<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Saver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>Bookmark Saver</h2>

        <form id="url-form">
            <div class="texts">
                <input
                    type="text"
                    id="title"
                    class="inputs"
                    placeholder="Bookmark Title"
                >

                <input
                    type="text"
                    id="title-url"
                    class="inputs"
                    placeholder="https://example.com"
                >
            </div>

            <button type="submit" class="add-btn">
                Add Bookmark
            </button>
        </form>

        <div class="result">
            <h2>Saved Bookmarks</h2>

            <ul id="urls"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
